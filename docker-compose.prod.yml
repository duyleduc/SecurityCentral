services:
  postgres:
    image: postgres:16-alpine
    container_name: sc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securitycentral
      POSTGRES_USER: securitycentral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securitycentral -d securitycentral"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Don't expose Postgres to the internet
    networks:
      - internal

  platform-api:
    build: ./platform-api
    container_name: sc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://securitycentral:${POSTGRES_PASSWORD}@postgres:5432/securitycentral
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGINS: https://${DOMAIN},http://${DOMAIN}
    volumes:
      - ./sc-agent/bin:/sc-agent/bin:ro
    networks:
      - internal
      - web

  dashboard:
    build: ./dashboard
    container_name: sc-dashboard
    restart: unless-stopped
    depends_on:
      - platform-api
    networks:
      - web

  monitor:
    build: ./sc-monitor
    container_name: sc-monitor
    restart: unless-stopped
    depends_on:
      - platform-api
    environment:
      SC_API_URL: http://platform-api:3000
      SC_API_KEY: ${MONITOR_API_KEY:-sc-monitor-key}
      SC_POLL_INTERVAL: 5s
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    container_name: sc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard
      - platform-api
    networks:
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  internal:
  web:
