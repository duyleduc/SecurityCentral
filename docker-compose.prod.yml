services:
  mysql:
    image: mysql:8.0
    container_name: sc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: securitycentral
      MYSQL_USER: securitycentral
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password
    # Don't expose MySQL to the internet
    networks:
      - internal

  platform-api:
    build: ./platform-api
    container_name: sc-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://securitycentral:${MYSQL_PASSWORD}@mysql:3306/securitycentral
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGINS: https://${DOMAIN},http://${DOMAIN}
    volumes:
      - ./sc-agent/bin:/sc-agent/bin:ro
    networks:
      - internal
      - web

  dashboard:
    build: ./dashboard
    container_name: sc-dashboard
    restart: unless-stopped
    depends_on:
      - platform-api
    networks:
      - web

  monitor:
    build: ./sc-monitor
    container_name: sc-monitor
    restart: unless-stopped
    depends_on:
      - platform-api
    environment:
      SC_API_URL: http://platform-api:3000
      SC_API_KEY: ${MONITOR_API_KEY:-sc-monitor-key}
      SC_POLL_INTERVAL: 5s
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    container_name: sc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard
      - platform-api
    networks:
      - web

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  internal:
  web:
