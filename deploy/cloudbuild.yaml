# Cloud Build config for GCP deployment
# Builds and deploys API, Worker, and Dashboard

steps:
  # Build API image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--target', 'api', '-t', 'gcr.io/$PROJECT_ID/sc-api:$SHORT_SHA', '.']

  # Build Worker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--target', 'worker', '-t', 'gcr.io/$PROJECT_ID/sc-worker:$SHORT_SHA', '.']

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sc-api:$SHORT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sc-worker:$SHORT_SHA']

  # Run Prisma migrations
  - name: 'gcr.io/$PROJECT_ID/sc-api:$SHORT_SHA'
    entrypoint: 'npx'
    args: ['prisma', 'migrate', 'deploy']
    env:
      - 'DATABASE_URL=${_DATABASE_URL}'

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sc-api'
      - '--image=gcr.io/$PROJECT_ID/sc-api:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--set-env-vars=NODE_ENV=production'

  # Deploy Worker to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sc-worker'
      - '--image=gcr.io/$PROJECT_ID/sc-worker:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--port=3001'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=1'

  # Build and deploy dashboard to Cloud Storage
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd dashboard
        npm ci
        VITE_API_URL=${_API_URL} VITE_AUTH_URL=${_AUTH_URL} npm run build

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gsutil'
    args: ['-m', 'rsync', '-r', '-d', 'dashboard/dist', 'gs://${_DASHBOARD_BUCKET}']

substitutions:
  _REGION: us-central1
  _DATABASE_URL: ''
  _API_URL: ''
  _AUTH_URL: ''
  _DASHBOARD_BUCKET: ''

images:
  - 'gcr.io/$PROJECT_ID/sc-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/sc-worker:$SHORT_SHA'
