services:
  postgres:
    image: postgres:16-alpine
    container_name: sc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securitycentral
      POSTGRES_USER: securitycentral
      POSTGRES_PASSWORD: securitycentral
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securitycentral -d securitycentral"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  platform-api:
    build: ./platform-api
    container_name: sc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://securitycentral:securitycentral@postgres:5432/securitycentral
      JWT_SECRET: change-me-in-production
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGINS: http://localhost,http://localhost:80
    volumes:
      - ./sc-agent/bin:/sc-agent/bin:ro
    ports:
      - "3000:3000"

  dashboard:
    build: ./dashboard
    container_name: sc-dashboard
    restart: unless-stopped
    depends_on:
      - platform-api
    ports:
      - "80:80"

volumes:
  postgres-data:
