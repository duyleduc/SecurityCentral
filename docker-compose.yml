services:
  mysql:
    image: mysql:8.0
    container_name: sc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: securitycentral
      MYSQL_USER: securitycentral
      MYSQL_PASSWORD: securitycentral
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: --default-authentication-plugin=mysql_native_password

  platform-api:
    build: ./platform-api
    container_name: sc-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://securitycentral:securitycentral@mysql:3306/securitycentral
      JWT_SECRET: change-me-in-production
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGINS: http://localhost,http://localhost:80
    volumes:
      - ./sc-agent/bin:/sc-agent/bin:ro
    ports:
      - "3000:3000"

  dashboard:
    build: ./dashboard
    container_name: sc-dashboard
    restart: unless-stopped
    depends_on:
      - platform-api
    ports:
      - "80:80"

volumes:
  mysql-data:
