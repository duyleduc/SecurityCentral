name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

env:
  GCP_REGION: us-east1
  GCS_BUCKET: sc-dashboard-securitycentral-491719

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          cd dashboard
          npm ci
          VITE_API_URL=${{ secrets.API_URL }} npm run build

      - name: Create GCS bucket (if needed)
        run: |
          gsutil ls -b gs://${{ env.GCS_BUCKET }} 2>/dev/null || \
            gsutil mb -p securitycentral-491719 -l ${{ env.GCP_REGION }} gs://${{ env.GCS_BUCKET }}
          gsutil web set -m index.html -e index.html gs://${{ env.GCS_BUCKET }}
          gsutil iam ch allUsers:objectViewer gs://${{ env.GCS_BUCKET }}

      - name: Upload to GCS
        run: |
          gsutil -m rsync -r -d dashboard/dist gs://${{ env.GCS_BUCKET }}
          gsutil -m setmeta -h "Cache-Control:no-cache" gs://${{ env.GCS_BUCKET }}/index.html

      - name: Update API CORS
        run: |
          DASHBOARD_URL="https://storage.googleapis.com/${{ env.GCS_BUCKET }}"
          API_URL="${{ secrets.API_URL }}"
          gcloud run services update sc-api \
            --region=${{ env.GCP_REGION }} \
            --set-env-vars="^||^CORS_ORIGINS=${DASHBOARD_URL},${API_URL}||DATABASE_URL=${{ secrets.TIDB_DATABASE_URL }}||JWT_SECRET=${{ secrets.JWT_SECRET }}||NODE_ENV=production"
