name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - migrate
          - api
          - dashboard
          - monitor

env:
  GCP_REGION: us-east1
  GCS_BUCKET: sc-dashboard-securitycentral-491719
  REGISTRY: us-east1-docker.pkg.dev/securitycentral-491719/securitycentral

jobs:
  # ---------------------------------------------------------------
  # Detect what changed
  # ---------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      monitor: ${{ steps.filter.outputs.monitor }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'platform-api/**'
              - 'sc-agent/**'
            dashboard:
              - 'dashboard/**'
            monitor:
              - 'sc-monitor/**'
            schema:
              - 'platform-api/prisma/**'

  # ---------------------------------------------------------------
  # Stage 1: Migrate database (only when schema changes)
  # ---------------------------------------------------------------
  migrate:
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.schema == 'true')
      || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'migrate'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-api/package-lock.json
      - name: Run Prisma migration
        run: |
          cd platform-api
          npm ci
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}

  # ---------------------------------------------------------------
  # Stage 2: Deploy API (only when api source changes)
  # ---------------------------------------------------------------
  deploy-api:
    needs: [changes, migrate]
    if: |
      always()
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
      && (
        (github.event_name == 'push' && needs.changes.outputs.api == 'true')
        || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'api'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.get-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.REGISTRY }}/api:${{ github.sha }} -t ${{ env.REGISTRY }}/api:latest ./platform-api
          docker push ${{ env.REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/api:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sc-api
          image: ${{ env.REGISTRY }}/api:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          env_vars: |
            DATABASE_URL=${{ secrets.TIDB_DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NODE_ENV=production
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            SC_MONITOR_API_KEY=${{ secrets.SC_MONITOR_API_KEY }}
          flags: >-
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3

      - name: Get API URL
        id: get-url
        run: |
          URL=$(gcloud run services describe sc-api --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # Stage 3: Deploy Dashboard (only when dashboard source changes)
  # ---------------------------------------------------------------
  deploy-dashboard:
    needs: [changes, deploy-api]
    if: |
      always()
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && (
        (github.event_name == 'push' && needs.changes.outputs.dashboard == 'true')
        || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'dashboard'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Get API URL
        id: api-url
        run: |
          URL=$(gcloud run services describe sc-api --region=${{ env.GCP_REGION }} --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build dashboard
        run: |
          cd dashboard
          npm ci
          VITE_API_URL=${{ steps.api-url.outputs.url }} npm run build

      - name: Setup GCS bucket
        run: |
          gsutil ls -b gs://${{ env.GCS_BUCKET }} 2>/dev/null || \
            gsutil mb -p securitycentral-491719 -l ${{ env.GCP_REGION }} gs://${{ env.GCS_BUCKET }}
          gsutil web set -m index.html -e index.html gs://${{ env.GCS_BUCKET }}
          gsutil iam ch allUsers:objectViewer gs://${{ env.GCS_BUCKET }}

      - name: Upload to GCS
        run: |
          gsutil -m rsync -r -d dashboard/dist gs://${{ env.GCS_BUCKET }}
          gsutil -m setmeta -h "Cache-Control:no-cache" gs://${{ env.GCS_BUCKET }}/index.html

      - name: Update API CORS
        run: |
          API_URL="${{ steps.api-url.outputs.url }}"
          # Origin headers from browsers only contain scheme+host (no path),
          # so we allow the bare GCS origin.
          gcloud run services update sc-api \
            --region=${{ env.GCP_REGION }} \
            --set-env-vars="^||^CORS_ORIGINS=https://storage.googleapis.com,${API_URL}||DATABASE_URL=${{ secrets.TIDB_DATABASE_URL }}||JWT_SECRET=${{ secrets.JWT_SECRET }}||NODE_ENV=production||SC_MONITOR_API_KEY=${{ secrets.SC_MONITOR_API_KEY }}"

  # ---------------------------------------------------------------
  # Stage 4: Deploy Monitor (only when sc-monitor changes)
  # ---------------------------------------------------------------
  deploy-monitor:
    needs: [changes, deploy-api, deploy-dashboard]
    if: |
      always()
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && (needs.deploy-dashboard.result == 'success' || needs.deploy-dashboard.result == 'skipped')
      && (
        (github.event_name == 'push' && needs.changes.outputs.monitor == 'true')
        || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'monitor'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build monitor binary
        run: |
          cd sc-monitor
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/sc-monitor-linux-amd64 ./cmd/sc-monitor

      - name: Get API URL
        id: api-url
        run: |
          URL=$(gcloud run services describe sc-api --region=${{ env.GCP_REGION }} --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy to GCE
        run: |
          API_URL="${{ steps.api-url.outputs.url }}"
          ZONE="us-central1-a"
          VM="sc-monitor"

          gsutil cp sc-monitor/bin/sc-monitor-linux-amd64 gs://${{ env.GCS_BUCKET }}/bin/sc-monitor

          if ! gcloud compute instances describe $VM --zone=$ZONE --quiet 2>/dev/null; then
            gcloud compute instances create $VM \
              --zone=$ZONE \
              --machine-type=e2-micro \
              --image-family=debian-12 \
              --image-project=debian-cloud \
              --boot-disk-size=10GB \
              --tags=sc-monitor \
              --metadata=startup-script="#!/bin/bash
          gsutil cp gs://${{ env.GCS_BUCKET }}/bin/sc-monitor /usr/local/bin/sc-monitor
          chmod +x /usr/local/bin/sc-monitor
          cat > /etc/systemd/system/sc-monitor.service <<EOF
          [Unit]
          Description=SecurityCentral Monitor
          After=network-online.target
          [Service]
          Type=simple
          Environment=SC_API_KEY=${{ secrets.SC_MONITOR_API_KEY }}
          ExecStart=/usr/local/bin/sc-monitor --api-url ${API_URL}
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable sc-monitor
          systemctl start sc-monitor" \
              --quiet
          else
            gcloud compute ssh $VM --zone=$ZONE --command="sudo gsutil cp gs://${{ env.GCS_BUCKET }}/bin/sc-monitor /usr/local/bin/sc-monitor && sudo chmod +x /usr/local/bin/sc-monitor && sudo systemctl restart sc-monitor" --quiet 2>/dev/null || \
              echo "SSH failed — binary uploaded to gs://${{ env.GCS_BUCKET }}/bin/sc-monitor"
          fi
