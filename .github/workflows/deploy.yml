name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: securitycentral-491719
  GCP_REGION: us-east1
  GCS_BUCKET: sc-dashboard-securitycentral-491719
  REGISTRY: us-east1-docker.pkg.dev/securitycentral-491719/securitycentral

jobs:
  # ---------------------------------------------------------------
  # Job 1: Deploy API to Cloud Run
  # ---------------------------------------------------------------
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          docker build -t ${{ env.REGISTRY }}/api:${{ github.sha }} -t ${{ env.REGISTRY }}/api:latest ./platform-api
          docker push ${{ env.REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/api:latest

      - name: Build agent binaries
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: |
          cd sc-agent
          GOOS=linux GOARCH=amd64 go build -o bin/sc-agent-linux-amd64 ./cmd/sc-agent
          GOOS=linux GOARCH=arm64 go build -o bin/sc-agent-linux-arm64 ./cmd/sc-agent

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sc-api
          image: ${{ env.REGISTRY }}/api:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          env_vars: |
            DATABASE_URL=${{ secrets.TIDB_DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NODE_ENV=production
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          flags: >-
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3

      - name: Get API URL
        id: api-url
        run: |
          URL=$(gcloud run services describe sc-api --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

    outputs:
      api_url: ${{ steps.api-url.outputs.url }}

  # ---------------------------------------------------------------
  # Job 2: Deploy Dashboard to GCS Bucket
  # ---------------------------------------------------------------
  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        run: |
          cd dashboard
          npm ci
          VITE_API_URL=${{ needs.deploy-api.outputs.api_url }} npm run build

      - name: Create GCS bucket (if needed)
        run: |
          gsutil ls -b gs://${{ env.GCS_BUCKET }} 2>/dev/null || \
            gsutil mb -p securitycentral-491719 -l ${{ env.GCP_REGION }} gs://${{ env.GCS_BUCKET }}
          gsutil web set -m index.html -e index.html gs://${{ env.GCS_BUCKET }}
          gsutil iam ch allUsers:objectViewer gs://${{ env.GCS_BUCKET }}

      - name: Upload to GCS
        run: |
          gsutil -m rsync -r -d dashboard/dist gs://${{ env.GCS_BUCKET }}
          gsutil -m setmeta -h "Cache-Control:no-cache" gs://${{ env.GCS_BUCKET }}/index.html

      - name: Update API CORS with dashboard URL
        run: |
          DASHBOARD_URL="https://storage.googleapis.com/${{ env.GCS_BUCKET }}"
          API_URL="${{ needs.deploy-api.outputs.api_url }}"
          gcloud run services update sc-api \
            --region=${{ env.GCP_REGION }} \
            --update-env-vars="CORS_ORIGINS=${DASHBOARD_URL},${API_URL}"

  # ---------------------------------------------------------------
  # Job 3: Run database migration
  # ---------------------------------------------------------------
  migrate:
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform-api/package-lock.json

      - name: Run Prisma migration
        run: |
          cd platform-api
          npm ci
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
