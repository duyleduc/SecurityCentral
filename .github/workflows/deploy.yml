name: Deploy to GCP

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  API_SERVICE: sc-api
  WORKER_SERVICE: sc-worker
  DASHBOARD_BUCKET: ${{ secrets.DASHBOARD_BUCKET }}

jobs:
  # ── Build & Push Docker Images ────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build API image
        run: docker build --target api -t "${REGISTRY}/${PROJECT_ID}/docker/${API_SERVICE}:${{ github.sha }}" .

      - name: Build Worker image
        run: docker build --target worker -t "${REGISTRY}/${PROJECT_ID}/docker/${WORKER_SERVICE}:${{ github.sha }}" .

      - name: Push images
        run: |
          docker push "${REGISTRY}/${PROJECT_ID}/docker/${API_SERVICE}:${{ github.sha }}"
          docker push "${REGISTRY}/${PROJECT_ID}/docker/${WORKER_SERVICE}:${{ github.sha }}"

    outputs:
      image_tag: ${{ github.sha }}

  # ── Run Database Migrations ───────────────────────
  migrate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: platform-api

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: platform-api

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: platform-api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Deploy API to Cloud Run ───────────────────────
  deploy-api:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy API
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker/${{ env.API_SERVICE }}:${{ needs.build.outputs.image_tag }}
          region: ${{ env.REGION }}
          flags: |
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --allow-unauthenticated
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            REDIS_URL=REDIS_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest
          env_vars: |
            NODE_ENV=production
            ELASTICSEARCH_URL=
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            LOG_LEVEL=info

  # ── Deploy Worker to Cloud Run ────────────────────
  deploy-worker:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Worker
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WORKER_SERVICE }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/docker/${{ env.WORKER_SERVICE }}:${{ needs.build.outputs.image_tag }}
          region: ${{ env.REGION }}
          flags: |
            --port=3001
            --memory=512Mi
            --cpu=1
            --min-instances=1
            --max-instances=1
            --no-allow-unauthenticated
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            REDIS_URL=REDIS_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest
          env_vars: |
            NODE_ENV=production
            ELASTICSEARCH_URL=
            LOG_LEVEL=info

  # ── Deploy Dashboard to Cloud Storage ─────────────
  deploy-dashboard:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to Cloud Storage
        run: gsutil -m rsync -r -d dashboard/dist gs://$DASHBOARD_BUCKET
